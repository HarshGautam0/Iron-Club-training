<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#5a3019" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Iron Club" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link rel="icon" type="image/png" href="icon-192.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>The Iron Club Training Log</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Bevan&family=Special+Elite&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        --wood1: #4a2c17;
        --wood2: #35200f;
        --leather: #7a4526;
        --leather2: #5a3019;
        --brass: #d9a441;
        --brass2: #8d6420;
        --paper: #f1e6c8;
        --ink: #2d2013;
        --steel1: #e4e4e0;
        --steel2: #a9aaa6;
        --red: #b3261e;
        --lcd: #2a3a1c;
        --lcdtxt: #b9e36a;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --wood1: #2b190c;
          --wood2: #1d1008;
          --paper: #e6d9b8;
        }
      }
      :root[data-theme="dark"] {
        --wood1: #2b190c;
        --wood2: #1d1008;
        --paper: #e6d9b8;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
        height: 100%;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: repeating-linear-gradient(
          92deg,
          var(--wood1) 0 7px,
          var(--wood2) 7px 9px,
          var(--wood1) 9px 22px,
          #3d2412 22px 23px
        );
        background-color: var(--wood1);
        font-family: "Special Elite", "Courier New", monospace;
        color: var(--ink);
      }
      .app {
        max-width: 480px;
        margin: 0 auto;
        height: calc(
          100dvh - env(safe-area-inset-top, 0px) -
            env(safe-area-inset-bottom, 0px)
        );
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 10px 10px 8px;
      }
      .leather {
        background:
          radial-gradient(
            circle at 20% 15%,
            rgba(255, 255, 255, 0.12),
            transparent 40%
          ),
          repeating-radial-gradient(
            circle at 30% 40%,
            rgba(0, 0, 0, 0.07) 0 1px,
            transparent 1px 3px
          ),
          linear-gradient(160deg, var(--leather), var(--leather2));
        border-radius: 16px;
        box-shadow:
          0 8px 18px rgba(0, 0, 0, 0.55),
          inset 0 2px 2px rgba(255, 255, 255, 0.2),
          inset 0 -3px 6px rgba(0, 0, 0, 0.4);
        position: relative;
      }
      .leather::after {
        content: "";
        position: absolute;
        inset: 5px;
        border: 2px dashed rgba(240, 214, 160, 0.6);
        border-radius: 12px;
        pointer-events: none;
      }
      .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 9px 16px;
        flex: none;
      }
      .plate {
        font-family: "Bevan", Georgia, serif;
        font-size: 18px;
        color: #3a2606;
        padding: 5px 14px;
        border-radius: 6px;
        background: linear-gradient(
          180deg,
          #f3d58a,
          var(--brass) 45%,
          var(--brass2)
        );
        box-shadow:
          0 2px 3px rgba(0, 0, 0, 0.6),
          inset 0 1px 1px #fff8;
        text-shadow: 0 1px 0 #fff6;
      }
      #date {
        color: #f0d9aa;
        font-size: 12px;
      }
      .vb {
        display: flex;
        gap: 6px;
      }
      .vbtn {
        font: inherit;
        font-size: 16px;
        width: 34px;
        height: 34px;
        border: 0;
        border-radius: 50%;
        cursor: pointer;
        background: linear-gradient(
          180deg,
          #f7f7f3,
          var(--steel1) 50%,
          var(--steel2)
        );
        box-shadow:
          0 3px 0 #6c6d69,
          0 5px 6px rgba(0, 0, 0, 0.5),
          inset 0 1px 1px #fff;
      }
      .vbtn.on {
        background: linear-gradient(180deg, #e7c26f, var(--brass));
      }
      .vbtn.live {
        background: radial-gradient(circle at 35% 25%, #ff8a7a, var(--red));
        animation: pulse 1.2s infinite;
      }
      @keyframes pulse {
        50% {
          box-shadow:
            0 0 0 6px rgba(179, 38, 30, 0.35),
            0 3px 0 #6c6d69;
        }
      }
      main {
        flex: 1;
        min-height: 0;
        position: relative;
      }
      .heard {
        position: absolute;
        left: 8px;
        right: 8px;
        top: 4px;
        z-index: 6;
        pointer-events: none;
        text-align: center;
        padding: 6px 10px;
        border-radius: 8px;
        background: var(--lcd);
        color: var(--lcdtxt);
        box-shadow:
          inset 0 2px 6px #000,
          0 4px 10px rgba(0, 0, 0, 0.5);
        opacity: 0;
        transform: translateY(-8px);
        transition: 0.2s;
        font-size: 14px;
      }
      .heard.on {
        opacity: 1;
        transform: none;
      }
      .page {
        position: absolute;
        inset: 0;
        display: none;
        flex-direction: column;
        gap: 10px;
        min-height: 0;
      }
      .page.on {
        display: flex;
        animation: flip 0.25s ease-out;
      }
      @keyframes flip {
        from {
          opacity: 0;
          transform: translateX(16px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .tabs {
        flex: none;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
        padding: 10px 14px;
      }
      .tab {
        font: inherit;
        font-size: 12px;
        border: 0;
        cursor: pointer;
        color: #3b3b38;
        padding: 7px 2px;
        border-radius: 10px;
        background: linear-gradient(
          180deg,
          #f7f7f3,
          var(--steel1) 50%,
          var(--steel2)
        );
        box-shadow:
          0 4px 0 #6c6d69,
          0 6px 8px rgba(0, 0, 0, 0.5),
          inset 0 1px 1px #fff;
        z-index: 1;
        position: relative;
        transition:
          transform 0.08s,
          box-shadow 0.08s;
      }
      .tab i {
        display: block;
        font-style: normal;
        font-size: 20px;
      }
      .tab.on {
        transform: translateY(3px);
        background: linear-gradient(180deg, #e7c26f, var(--brass));
        box-shadow:
          0 1px 0 #6c6d69,
          inset 0 3px 6px rgba(0, 0, 0, 0.35);
        color: #2e1d05;
      }
      .tab:focus-visible,
      .btn:focus-visible,
      .bigbtn:focus-visible,
      .tile:focus-visible,
      .x:focus-visible,
      .qx:focus-visible,
      .vbtn:focus-visible {
        outline: 3px solid #7fd0ff;
        outline-offset: 2px;
      }
      .dials {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        padding: 18px 16px 12px;
      }
      .dial {
        background: radial-gradient(
          circle at 35% 30%,
          #fff,
          var(--steel1) 60%,
          var(--steel2)
        );
        border-radius: 50%;
        padding: 5px;
        box-shadow:
          0 4px 8px rgba(0, 0, 0, 0.6),
          inset 0 0 0 4px var(--brass),
          inset 0 0 0 6px var(--brass2);
      }
      .dial svg {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 50%;
      }
      .needle {
        transform-origin: 50px 52px;
        transition: transform 1.2s cubic-bezier(0.3, 1.6, 0.5, 1);
      }
      .cap {
        font-size: 12px;
        text-align: center;
        color: #f0d9aa;
        margin-top: 6px;
        position: relative;
        z-index: 1;
      }
      .summary {
        padding: 18px 20px;
        color: #f6e7c1;
        font-size: 15px;
        line-height: 30px;
      }
      .summary .t2 {
        font-family: "Bevan", Georgia, serif;
        font-size: 17px;
        color: #f3d58a;
      }
      .bars {
        display: flex;
        gap: 6px;
        height: 96px;
        margin: 8px 0 6px;
      }
      .bc {
        flex: 1;
        height: 100%;
        display: grid;
        grid-template-rows: 1fr auto auto;
        justify-items: center;
        gap: 2px;
        font-size: 11px;
        line-height: 1.2;
        color: #f0d9aa;
      }
      .bc b {
        font-weight: 400;
        font-size: 10px;
        opacity: 0.85;
        min-height: 12px;
      }
      .bar {
        align-self: end;
        width: 100%;
        border-radius: 4px 4px 2px 2px;
        background: linear-gradient(180deg, #f3d58a, var(--brass2));
        box-shadow:
          inset 0 1px 1px #fff8,
          0 2px 3px rgba(0, 0, 0, 0.5);
        transition: height 0.6s cubic-bezier(0.3, 1.4, 0.5, 1);
      }
      .bar.now {
        background: linear-gradient(180deg, #ff8a7a, var(--red));
      }
      .bar.fut {
        opacity: 0.3;
      }
      .summary {
        padding: 12px 20px;
        line-height: 26px;
      }
      .bars {
        height: 80px;
      }
      .inp {
        width: 70px;
        font: inherit;
        font-size: 15px;
        padding: 2px 6px;
        border: 0;
        border-radius: 6px;
        color: var(--lcdtxt);
        background: var(--lcd);
        box-shadow: inset 0 2px 5px #000;
        text-align: center;
      }
      .inp:focus-visible {
        outline: 3px solid #7fd0ff;
      }
      .sumline {
        display: flex;
        justify-content: space-between;
        border-bottom: 1px dotted #f0d9aa77;
      }
      .ledger {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        background:
          repeating-linear-gradient(
            180deg,
            transparent 0 27px,
            #9bb5c9 27px 28px
          ),
          linear-gradient(90deg, #d9c9a0, var(--paper) 8%, var(--paper));
        background-attachment: local;
        border-radius: 6px 14px 14px 6px;
        padding: 10px 12px 14px 44px;
        box-shadow:
          0 8px 18px rgba(0, 0, 0, 0.55),
          inset 6px 0 10px rgba(0, 0, 0, 0.25);
        line-height: 28px;
        font-size: 15px;
      }
      .steppers {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(94px, 1fr));
        gap: 6px;
        width: 100%;
        flex: none;
      }
      .stp {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
        padding: 6px 4px 8px;
        border-radius: 12px;
        background: linear-gradient(180deg, #d4d5d1, #b9bab6);
        box-shadow:
          inset 0 2px 5px rgba(0, 0, 0, 0.35),
          0 1px 0 #fff;
      }
      .stp small {
        font-size: 10px;
        letter-spacing: 0.6px;
        text-transform: uppercase;
        color: #4b4b47;
        line-height: 1;
      }
      .stp .ctl {
        display: flex;
        align-items: center;
        gap: 3px;
      }
      .stp .val {
        min-width: 34px;
        padding: 2px 3px;
        text-align: center;
        font-size: 15px;
        color: var(--lcdtxt);
        background: var(--lcd);
        border-radius: 6px;
        box-shadow: inset 0 2px 5px #000;
        text-shadow: 0 0 6px #8fd03a;
      }
      .stp .rb {
        width: 24px;
        height: 24px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        font: inherit;
        font-size: 16px;
        line-height: 1;
        cursor: pointer;
        color: #fff;
        background: linear-gradient(180deg, #5b5b57, #2e2e2b);
        box-shadow:
          0 3px 0 #111,
          0 4px 6px rgba(0, 0, 0, 0.4),
          inset 0 1px 1px #fff4;
        transition:
          transform 0.08s,
          box-shadow 0.08s;
      }
      .stp .rb:active {
        transform: translateY(2px);
        box-shadow:
          0 1px 0 #111,
          inset 0 2px 4px rgba(0, 0, 0, 0.5);
      }
      .stp .rb:focus-visible {
        outline: 3px solid #7fd0ff;
        outline-offset: 2px;
      }
      .demo {
        position: fixed;
        inset: 0;
        z-index: 30;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background: rgba(15, 8, 3, 0.75);
      }
      .dcard {
        width: min(420px, 100%);
        padding: 14px;
        border-radius: 18px;
        text-align: center;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.55), transparent 18%),
          repeating-linear-gradient(90deg, #c9cac6 0 1px, #dedfdb 1px 3px);
        box-shadow:
          0 14px 34px rgba(0, 0, 0, 0.7),
          inset 0 2px 2px #fff;
        display: flex;
        flex-direction: column;
        gap: 10px;
        align-items: center;
      }
      .dscreen {
        width: 100%;
        border-radius: 14px;
        padding: 8px;
        background: #111;
        box-shadow:
          inset 0 0 0 3px #3a3a38,
          inset 0 4px 10px #000,
          0 1px 0 #fff;
      }
      .dscreen svg {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 8px;
        background: radial-gradient(circle at 50% 40%, #2a3a1c, #141d0c);
      }
      .dscreen polyline {
        fill: none;
        stroke: #b9e36a;
        stroke-width: 3.2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .dscreen #d1,
      .dscreen #d2 {
        stroke: #5f8a30;
      }
      .dscreen circle {
        fill: none;
        stroke: #b9e36a;
        stroke-width: 3;
      }
      .dscreen polyline,
      .dscreen circle {
        filter: drop-shadow(0 0 1.5px #8fd03a);
      }
      .dtip {
        margin: 0;
        font-size: 14px;
        line-height: 1.4;
        color: #3b3b38;
      }
      .ibar {
        display: inline-flex;
        gap: 6px;
        vertical-align: middle;
        flex: none;
      }
      .ibtn {
        width: 32px;
        height: 32px;
        border: 0;
        border-radius: 50%;
        padding: 0;
        cursor: pointer;
        display: grid;
        place-items: center;
        font-size: 15px;
        line-height: 1;
        background: linear-gradient(
          180deg,
          #f7f7f3,
          var(--steel1) 50%,
          var(--steel2)
        );
        box-shadow:
          0 3px 0 #6c6d69,
          0 4px 6px rgba(0, 0, 0, 0.45),
          inset 0 1px 1px #fff;
        text-decoration: none;
        color: #3b3b38;
      }
      .ibtn:active {
        transform: translateY(2px);
        box-shadow:
          0 1px 0 #6c6d69,
          inset 0 2px 4px rgba(0, 0, 0, 0.4);
      }
      .ibtn:focus-visible,
      .dcard .btn:focus-visible {
        outline: 3px solid #7fd0ff;
        outline-offset: 2px;
      }
      .ledger.small {
        flex: none;
      }
      .ledger h2 {
        font-family: "Bevan", Georgia, serif;
        font-weight: 400;
        margin: 0;
        font-size: 18px;
        line-height: 28px;
      }
      .ent {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .ent span:first-child {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .empty,
      .lap {
        color: #7a6a4c;
      }
      .lap {
        font-size: 12px;
        color: #4b4b47;
        line-height: 1.4;
      }
      .stamp {
        display: inline-block;
        transform: rotate(-4deg);
        border: 2px solid var(--red);
        color: var(--red);
        padding: 0 8px;
        line-height: 22px;
        font-size: 13px;
        border-radius: 4px;
      }
      .x {
        font: inherit;
        border: 0;
        background: none;
        color: var(--red);
        cursor: pointer;
        font-size: 18px;
        padding: 0 6px;
      }
      .rack {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        grid-auto-rows: minmax(46px, 1fr);
        gap: 10px;
        padding: 2px 2px 6px;
      }
      .tile {
        font: inherit;
        color: #3b3b38;
        text-align: left;
        border: 0;
        cursor: pointer;
        padding: 5px 10px;
        border-radius: 10px;
        display: flex;
        gap: 9px;
        align-items: center;
        font-size: 14px;
        line-height: 1.15;
        background: linear-gradient(
          180deg,
          #f7f7f3,
          var(--steel1) 50%,
          var(--steel2)
        );
        box-shadow:
          0 5px 0 #6c6d69,
          0 8px 10px rgba(0, 0, 0, 0.5),
          inset 0 1px 1px #fff;
        transition:
          transform 0.08s,
          box-shadow 0.08s;
      }
      .tile i {
        font-style: normal;
        font-size: 21px;
      }
      .tile:active,
      .tile.sel {
        transform: translateY(4px);
        box-shadow:
          0 1px 0 #6c6d69,
          inset 0 3px 6px rgba(0, 0, 0, 0.35);
      }
      .tile.sel {
        background: linear-gradient(180deg, #e7c26f, var(--brass));
        color: #2e1d05;
      }
      .station {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        justify-content: space-around;
        align-items: center;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.55), transparent 18%),
          repeating-linear-gradient(90deg, #c9cac6 0 1px, #dedfdb 1px 3px);
        border-radius: 16px;
        padding: 10px;
        box-shadow:
          0 8px 18px rgba(0, 0, 0, 0.55),
          inset 0 2px 2px #fff,
          inset 0 -3px 5px rgba(0, 0, 0, 0.3);
        text-align: center;
        position: relative;
      }
      .station::before,
      .station::after {
        content: "";
        position: absolute;
        top: 7px;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #fff, #888);
        box-shadow: 0 1px 2px #000a;
      }
      .station::before {
        left: 8px;
      }
      .station::after {
        right: 8px;
      }
      .station.plan {
        justify-content: flex-start;
        gap: 8px;
      }
      h2.t {
        font-family: "Bevan", Georgia, serif;
        font-weight: 400;
        font-size: 19px;
        margin: 0;
        color: #4b4b47;
        text-shadow: 0 1px 0 #fff;
      }
      .odo {
        display: inline-flex;
        gap: 3px;
        padding: 6px 9px;
        background: #17110b;
        border-radius: 10px;
        box-shadow:
          inset 0 3px 8px #000,
          0 1px 0 #fff;
        font-size: 44px;
        line-height: 1.2em;
      }
      .odo.sm {
        font-size: 26px;
        padding: 4px 7px;
      }
      .w {
        width: 0.68em;
        height: 1.2em;
        overflow: hidden;
        border-radius: 4px;
        background: linear-gradient(
          180deg,
          #888,
          #f6f2e4 28%,
          #fff 50%,
          #f6f2e4 72%,
          #777
        );
        box-shadow: inset 0 0 6px #0008;
        font-family: "Bevan", Georgia, serif;
        color: #1c1c1c;
      }
      .w .s {
        transition: transform 0.45s cubic-bezier(0.4, 1.4, 0.5, 1);
      }
      .w .s b {
        display: block;
        height: 1.2em;
        text-align: center;
        font-weight: 400;
      }
      .row {
        display: flex;
        gap: 8px;
        justify-content: center;
        align-items: center;
        flex-wrap: wrap;
      }
      .btn {
        font: inherit;
        font-size: 14px;
        padding: 9px 14px;
        border: 0;
        border-radius: 9px;
        cursor: pointer;
        color: #3a2606;
        background: linear-gradient(
          180deg,
          #f3d58a,
          var(--brass) 50%,
          var(--brass2)
        );
        box-shadow:
          0 4px 0 #5c4010,
          0 6px 8px rgba(0, 0, 0, 0.45),
          inset 0 1px 1px #fff9;
        transition:
          transform 0.08s,
          box-shadow 0.08s;
      }
      .btn:active,
      .btn.in {
        transform: translateY(3px);
        box-shadow:
          0 1px 0 #5c4010,
          inset 0 2px 5px rgba(0, 0, 0, 0.4);
      }
      .btn.dk {
        color: #fff;
        background: linear-gradient(180deg, #5b5b57, #2e2e2b);
        box-shadow:
          0 4px 0 #111,
          0 6px 8px rgba(0, 0, 0, 0.45),
          inset 0 1px 1px #fff4;
      }
      .btn.rd {
        color: #fff;
        background: linear-gradient(180deg, #e3584c, var(--red) 55%, #7a150f);
        box-shadow:
          0 4px 0 #4d0d09,
          0 6px 8px rgba(0, 0, 0, 0.45),

  </head>
  <body>
    <div class="app">
      <header class="leather top">

        ><span class="vb"

      <main>
        <div id="heard" class="heard" role="status"></div>
        <section class="page" id="p-home">

          <div class="ledger" id="ledger"></div>
        </section>
      </main>
      <nav class="leather tabs" id="tabs"></nav>
    </div>
    <script>
      /* ---------- data ---------- */
      const EX = [];
      const X = (g, k, l) =>
        l.forEach(([id, n, i]) => EX.push({ id, n, i, k, g }));
      X("s", "rep", [
        ["push", "Push-ups", "💪"],
        ["squat", "Squats", "🏋️"],
        ["lunge", "Lunges", "🚶"],
        ["wlunge", "Walking lunges", "🐾"],
        ["bridge", "Glute bridges", "🌉"],
        ["calf", "Calf raises", "🦶"],
        ["clam", "Clamshells", "🐚"],
        ["side", "Side leg raises", "🦵"],
        ["pike", "Pike push-ups", "🔺"],
        ["dips", "Tricep dips", "🪑"],
        ["kick", "Donkey kicks", "🍑"],
      ]);
      X("s", "time", [["wall", "Wall sit", "🧱"]]);
      X("c", "rep", [
        ["crunch", "Crunches", "🤸"],
        ["bicycle", "Bicycle crunches", "🚲"],
        ["twist", "Russian twists", "🌀"],
        ["legr", "Leg raises", "🦿"],
        ["super", "Supermans", "🦸"],
        ["bird", "Bird-dogs", "🐕"],
      ]);
      X("c", "time", [
        ["plank", "Plank", "📏"],
        ["sidep", "Side plank", "📐"],
        ["flutter", "Flutter kicks", "🦋"],
        ["hollow", "Hollow hold", "🥣"],
        ["mtn", "Mountain climbers", "⛰️"],
      ]);
      X("r", "rep", [
        ["stride", "Strides", "⚡"],
        ["bound", "Bounding", "🦘"],
        ["burpee", "Burpees", "🔥"],
        ["skater", "Skater jumps", "⛸️"],
        ["jjack", "Jumping jacks", "⭐"],
        ["jsquat", "Jump squats", "🚀"],
      ]);
      X("r", "time", [
        ["hk", "High knees", "🐇"],
        ["butt", "Butt kicks", "🥾"],
        ["askip", "A-skips", "🤾"],
        ["sprint", "Sprint bursts", "💨"],
        ["rope", "Jump rope", "➰"],
        ["shadow", "Shadow boxing", "🥊"],
      ]);
      X("m", "time", [
        ["bal", "Single-leg balance", "🧘"],
        ["hams", "Hamstring stretch", "🙆"],
        ["quads", "Quad stretch", "🧎"],
        ["hips", "Hip flexor stretch", "🏃"],
        ["catcow", "Cat-cow", "🐈"],
        ["child", "Child's pose", "🛌"],
        ["calfs", "Calf stretch", "🧦"],
        ["pigeon", "Pigeon pose", "🕊️"],
        ["spine", "Spinal twist", "🌪️"],
        ["arms", "Arm circles", "🔄"],
      ]);
      const GN = { s: "Strength", c: "Core", r: "Cardio", m: "Stretch" };
      const PACES = [
        ["Slow", 3000],
        ["Normal", 2000],
        ["Fast", 1200],
      ];
      const GOAL = { reps: 150, mins: 15, sets: 10, kcal: 150 };
      const PRE = [
        [
          "🔥 Quick warm-up",
          [
            ["hk", 30],
            ["butt", 30],
            ["askip", 30],
            ["arms", 30],
            ["jjack", 20],
          ],
        ],
        [
          "🦵 Leg day",
          [
            ["squat", 20],
            ["lunge", 16],
            ["bridge", 20],
            ["wall", 40],
            ["calf", 25],
            ["jsquat", 12],
          ],
        ],
        [
          "💪 Upper body",
          [
            ["push", 15],
            ["pike", 10],
            ["dips", 12],
            ["super", 12],
            ["plank", 40],
          ],
        ],
        [
          "🎯 Core crusher",
          [
            ["plank", 40],
            ["bicycle", 30],
            ["twist", 30],
            ["flutter", 30],
            ["legr", 15],
            ["hollow", 20],
          ],
        ],
        [
          "⚡ Cardio blast",
          [
            ["jjack", 30],
            ["burpee", 10],
            ["mtn", 30],
            ["skater", 20],
            ["sprint", 20],
            ["hk", 30],
          ],
        ],
        [
          "🧘 Cool-down",
          [
            ["hams", 30],
            ["quads", 30],
            ["hips", 30],
            ["child", 30],
            ["spine", 30],
          ],
        ],
      ];
      const exOf = (id) => EX.find((e) => e.id === id);
      const $ = (id) => document.getElementById(id);
      const el = (t, c, h) => {
        const e = document.createElement(t);
        if (c) e.className = c;
        if (h != null) e.innerHTML = h;
        return e;
      };
      const two = (n) => String(n).padStart(2, "0");
      const fmt = (ms) => {
        const s = Math.floor(ms / 1000),
          h = Math.floor(s / 3600);
        return (
          (h ? h + ":" : "") + two(Math.floor(s / 60) % 60) + ":" + two(s % 60)
        );
      };
      const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
      const desc = (it) => {
        const x = exOf(it.ex);
        return (
          x.i +
          " " +
          x.n +
          " · " +
          (x.k === "rep" ? it.v + " reps, " + PACES[it.pi][0] : it.v + " s")
        );
      };

      /* ---------- state ---------- */
      let OLD = null,
        log = [],
        tab = "train",
        cur = null,
        count = 0,
        target = 20,
        tTarget = 30,
        pi = 1,
        autoT = null,
        tBase = 0,
        tStart = 0,
        tOn = false,
        tTimer = null,
        CAT = "s";
      const P = {
        q: [],
        rest: 10,
        idx: 0,
        ph: "idle",
        paused: false,
        acc: 0,
        cnt: 0,
        tot: 0,
        last: 0,
        tm: null,
        label: "",
        rounds: 1,
        rrest: 30,
        rd: 1,
      };
      let S = { ex: null, v: 20, pi: 1 };
      const dayKey = () => new Date().toDateString();
      try {
        const d = JSON.parse(localStorage.getItem("ironclub") || "null");
        if (d && d.day === dayKey()) log = d.log || [];
        else if (d && d.log && d.log.length) OLD = d;
      } catch (e) {}
      try {
        const d = JSON.parse(localStorage.getItem("ironclub-plan") || "null");
        if (d) {
          P.q = (d.q || []).filter((it) => exOf(it.ex));
          P.rest = typeof d.rest === "number" ? d.rest : 10;
          P.rounds = clamp(+d.rounds || 1, 1, 20);
          P.rrest = typeof d.rrest === "number" ? d.rrest : 30;
        }
      } catch (e) {}
      const dk = () => new Date().toLocaleDateString("en-CA");
      let HIST = {};
      try {
        HIST = JSON.parse(localStorage.getItem("ironclub-hist") || "{}");
      } catch (e) {}
      function tot() {
        let reps = 0,
          secs = 0;
        log.forEach((e) => {
          if (e.u === "reps") {
            reps += e.v;
            secs += e.v * 3;
          } else if (e.u === "sec") secs += e.v;
        });
        return { reps, secs, sets: log.length, kcal: kcalTotal(), log: log };
      }
      const save = () => {
        HIST[dk()] = tot();
        try {
          localStorage.setItem(
            "ironclub",
            JSON.stringify({ day: dayKey(), log }),
          );
          localStorage.setItem("ironclub-hist", JSON.stringify(HIST));
        } catch (e) {}
      };
      const savePlan = () => {
        try {
          localStorage.setItem(
            "ironclub-plan",
            JSON.stringify({
              q: P.q,
              rest: P.rest,
              rounds: P.rounds,
              rrest: P.rrest,
            }),
          );
        } catch (e) {}
      };
      const add = (e) => {
        const o = log.find((z) => z.ex === e.ex && z.u === e.u);
        if (o) {
          o.v += e.v;
          o.n = (o.n || 1) + 1;
          log = log.filter((z) => z !== o);
          log.push(o);
        } else {
          e.id = Date.now() + Math.random();
          e.n = 1;
          log.push(e);
        }
        save();
      };
      $("date").textContent = new Date().toLocaleDateString(undefined, {
        weekday: "short",
        day: "numeric",
        month: "short",
      });

      /* ---------- voice ---------- */
      let VOICE = true,
        want = false,
        rec = null,
        lastSpoke = 0,
        WL = null,
        AC;
      try {
        VOICE = localStorage.getItem("ic-voice") !== "0";
      } catch (e) {}
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      function say(t, force) {
        if (!VOICE && !force) return;
        t = String(t)
          .replace(/push-ups?/gi, (m) => m.replace("-", ""))
          .replace(/-/g, " ");
        try {
          const u = new SpeechSynthesisUtterance(t);
          u.rate = 1.05;
          u.onend = () => (lastSpoke = Date.now());
          speechSynthesis.cancel();
          speechSynthesis.speak(u);
        } catch (e) {}
      }
      function tick(f) {
        try {
          AC = AC || new (window.AudioContext || window.webkitAudioContext)();
          const o = AC.createOscillator(),
            g = AC.createGain();
          o.frequency.value = f || 880;
          g.gain.value = 0.07;
          o.connect(g);
          g.connect(AC.destination);
          o.start();
          o.stop(AC.currentTime + 0.07);
        } catch (e) {}
      }
      function setVoice(v, quiet) {
        VOICE = v;
        try {
          localStorage.setItem("ic-voice", v ? "1" : "0");
        } catch (e) {}
        $("vsay").textContent = v ? "🔊" : "🔇";
        $("vsay").classList.toggle("on", v);
        if (v && !quiet) say("Voice coaching on", true);
      }
      function heard(t) {
        const h = $("heard");
        h.textContent = t;
        h.classList.add("on");
        clearTimeout(heard.t);
        heard.t = setTimeout(() => h.classList.remove("on"), 3500);
      }
      async function wake(on) {
        try {
          if (on) {
            if (navigator.wakeLock && !WL) {
              WL = await navigator.wakeLock.request("screen");
              WL.addEventListener("release", () => {
                WL = null;
              });
            }
          } else if (WL) {
            await WL.release();
            WL = null;
          }
        } catch (e) {}
      }
      const idleWake = () => {
        if (!autoT && !tOn && P.ph !== "work" && P.ph !== "rest") wake(false);
      };
      const key = (e) =>
        e.n
          .toLowerCase()
          .replace(/-/g, " ")
          .replace(/(es|s)$/, "");
      function findEx(t) {
        t = t.replace(/-/g, " ");
        return [...EX]
          .sort((a, b) => key(b).length - key(a).length)
          .find((e) => t.includes(key(e)));
      }
      function togglePP() {
        P.paused = !P.paused;
        P.last = Date.now();
        playView();
      }
      function cmd(t) {
        let m;
        const act = P.ph === "work" || P.ph === "rest";
        if (
          (m = t.match(/(?:go to|open|show|take me to) +(?:the +)?([a-z]+)/))
        ) {
          const pg = {
            dials: "home",
            dial: "home",
            home: "home",
            today: "home",
            train: "train",
            training: "train",
            exercises: "train",
            routine: "plan",
            plan: "plan",
            presets: "plan",
            log: "log",
            ledger: "log",
            history: "log",
          }[m[1]];
          if (pg) {
            go(pg);
            say("Opening " + m[1]);
            return;
          }
        }
        if ((m = t.match(/([0-9]+) rounds?/))) {
          P.rounds = clamp(+m[1], 1, 20);
          savePlan();
          say(P.rounds + " round" + (P.rounds > 1 ? "s" : ""));
          if (tab === "plan" && P.ph === "idle") planView();
          if (!/\bstart\b/.test(t)) return;
        }
        if (/\bstart\b.*\b(routine|workout)\b/.test(t)) {
          go("plan");
          if (P.ph === "idle") startPlan();
          return;
        }
        if (/\b(pause|hold)\b/.test(t)) {
          if (act && !P.paused) togglePP();
          else if (autoT) stopAuto();
          else if (tOn) stopT();
          return;
        }
        if (/\b(resume|continue|carry on)\b/.test(t)) {
          if (act && P.paused) togglePP();
          else if (cur && cur.k === "rep" && !autoT) startAuto();
          else if (cur && cur.k === "time" && !tOn) startT();
          return;
        }
        if (/\bstop\b|\bfinish\b|\bend\b/.test(t)) {
          if (act) stopPlan();
          else if (autoT) stopAuto();
          else if (tOn) stopT();
          return;
        }
        if (/\b(skip|next)\b/.test(t)) {
          if (act) P.ph === "rest" ? beginWork() : closeItem(false);
          return;
        }
        if (/\b(log|save)\b/.test(t)) {
          if (cur) commit();
          return;
        }
        if (/\bunmute\b|\btalk to me\b/.test(t)) {
          setVoice(true);
          return;
        }
        if (/\b(mute|quiet|silence)\b/.test(t)) {
          say("Muted");
          setVoice(false, true);
          return;
        }
        const e = findEx(t);
        if (e && /\b(start|do|begin)\b/.test(t)) {
          const n = (t.match(/[0-9]+/) || [])[0];
          go("train");
          work(e);
          if (e.k === "rep") {
            if (n) target = clamp(+n, 1, 999);
            upd();
            startAuto();
          } else {
            if (n) tTarget = clamp(+n, 5, 3600);
            upd();
            startT();
          }
          return;
        }
        heard("Try: start 20 push-ups, start routine, go to log");
      }
      function mic() {
        if (!SR) {
          heard("Voice commands need Chrome, Edge or Safari");
          return;
        }
        if (want) {
          want = false;
          try {
            rec.stop();
          } catch (e) {}
          $("vmic").classList.remove("live");
          heard("Mic off");
          return;
        }
        want = true;
        rec = new SR();
        rec.lang = "en-US";
        rec.continuous = true;
        rec.interimResults = false;
        rec.onstart = () => {
          $("vmic").classList.add("live");
          heard('Listening… say "start 20 push-ups"');
        };
        rec.onend = () => {
          if (want)
            setTimeout(() => {
              try {
                rec.start();
              } catch (e) {}
            }, 300);
          else $("vmic").classList.remove("live");
        };
        rec.onerror = (e) => {
          if (e.error === "not-allowed" || e.error === "service-not-allowed") {
            want = false;
            $("vmic").classList.remove("live");
            heard(
              "Microphone blocked. Allow mic access and open the link in your browser.",
            );
          }
        };
        rec.onresult = (e) => {
          for (let i = e.resultIndex; i < e.results.length; i++) {
            if (!e.results[i].isFinal) continue;
            if (speechSynthesis.speaking || Date.now() - lastSpoke < 900)
              continue;
            const t = e.results[i][0].transcript.toLowerCase().trim();
            heard("“" + t + "”");
            cmd(t);
          }
        };
        try {
          rec.start();
        } catch (e) {}
      }

      /* ---------- tabs ---------- */
      [
        ["home", "🎛️", "Dials"],
        ["train", "🏋️", "Train"],
        ["plan", "📋", "Routine"],
        ["log", "📒", "Log"],
      ].forEach(([id, i, l]) => {
        const b = el("button", "tab", "<i>" + i + "</i>" + l);
        b.dataset.t = id;
        b.onclick = () => go(id);
        $("tabs").appendChild(b);
      });
      function go(t) {
        if (t === "train") {
          stopAuto();
          stopT();
        }
        tab = t;
        document
          .querySelectorAll(".tab")
          .forEach((b) => b.classList.toggle("on", b.dataset.t === t));
        document
          .querySelectorAll(".page")
          .forEach((p) => p.classList.toggle("on", p.id === "p-" + t));
        if (t === "home") render(true);
        if (t === "log") {
          LOGDAY = 0;
          render();
        }
        if (t === "train") showRack();
        if (t === "plan") planView();
      }
      function setWheels(box, str) {
        if (box.dataset.len != String(str.length)) {
          box.innerHTML = "";
          box.dataset.len = str.length;
          [...str].forEach(() => {
            const w = el("div", "w");
            const s = el("div", "s", "");
            for (let d = 0; d < 10; d++) s.appendChild(el("b", "", d));
            w.appendChild(s);
            box.appendChild(w);
          });
        }
        [...box.children].forEach(
          (c, i) =>
            (c.firstChild.style.transform =
              "translateY(-" + str[i] * 1.2 + "em)"),
        );
      }
      function seg(fn) {
        const r = el("div", "row");
        r.style.flex = "none";

          flash("Nothing to log yet");

            return `<line x1="${100 + Math.sin(a) * r}" y1="${100 - Math.cos(a) * r}" x2="${100 + Math.sin(a) * (r - l)}" y2="${100 - Math.cos(a) * (r - l)}" stroke="#2d2013" stroke-width="${i % 5 ? 1 : 2.5}"/>`;

          .join(

      function startPlan() {
        if (!P.q.length) {

      function pstep() {
        const n = Date.now(),
          dt = n - P.last;
        P.last = n;
        if (P.paused || (P.ph !== "rest" && P.ph !== "work")) return;
        P.acc += dt;
        const it = P.q[P.idx],
          x = exOf(it.ex);
        if (P.ph === "rest") {
          if (P.acc >= P.tot) {
            beginWork();
            return;
          }
        } else if (x.k === "rep") {
          const pc = PACES[it.pi][1];
          while (P.acc >= pc && P.cnt < it.v) {
            P.acc -= pc;
            P.cnt++;
            tick(P.cnt >= it.v ? 1320 : 880);
            say(String(P.cnt));
          }
          if (P.cnt >= it.v) {
            pDraw();
            closeItem(true);
            return;
          }
        } else if (P.acc >= it.v * 1000) {
          closeItem(true);
          return;
        }
        pDraw();

      function beginWork() {

      function pDraw() {
        if (!$("pl") || tab !== "plan" || (P.ph !== "rest" && P.ph !== "work"))
          return;
        const it = P.q[P.idx],

          "All-out fast running for the set time. Drive your arms and lean slightly forward.",
        rope: "Small hops on the balls of your feet. Turn the rope from your wrists.",
        shadow:
          "Staggered stance, hands up. Throw jabs and crosses, rotating your hips.",
        bal: "Stand tall on one leg with your eyes on a fixed point. Lift the other foot slightly.",
        hams: "Hinge from your hips and reach toward your toes with a flat back. Don't bounce.",
        quads:
          "Stand tall and pull one heel toward your glutes. Keep your knees together.",
        hips: "Half-kneeling lunge. Tuck your pelvis and shift forward until the front of the hip stretches.",
        catcow:
          "On hands and knees, arch your back, then round it. Move with your breath.",
        child:
          "Sit back on your heels, reach your arms forward and rest your forehead down.",
        calfs:
          "Hands on a wall, one leg back with the heel down. Lean in until your calf stretches.",
        pigeon:
          "Front shin angled across, back leg straight behind. Fold forward over the front leg.",
        spine:
          "Sit tall, cross one leg over and rotate toward the bent knee. Keep your spine long.",
        arms: "Stand tall and make slow, big circles with straight arms. Go in both directions.",
      };
      const rad = Math.PI / 180,
        PT = (x, y, a, l) => [
          x + l * Math.cos(a * rad),
          y + l * Math.sin(a * rad),
        ];
      const full = (p) =>
        p.length === 7
          ? [p[0], p[1], p[2], p[3], p[4], p[3], p[4], p[5], p[6], p[5], p[6]]
          : p;
      function figure(p) {
        const [hx, hy, T, a, b, c, d, e, f, g, h] = p,
          H = [hx, hy],
          N = PT(hx, hy, T, 22),
          HD = PT(N[0], N[1], T, 8);
        const leg = (u, v) => {
          const k = PT(hx, hy, u, 17),
            an = PT(k[0], k[1], v, 17),
            dy = 74 - an[1],
            fa = dy <= 0.5 ? 0 : dy <= 6 ? Math.asin(dy / 6) / rad : 45;
          return [H, k, an, PT(an[0], an[1], fa, 6)];
        };
        const arm = (u, v) => {
          const k = PT(N[0], N[1], u, 12);
          return [N, k, PT(k[0], k[1], v, 12)];
        };
        return {
          d1: leg(c, d),
          d2: arm(g, h),
          d3: [H, N],
          d4: leg(a, b),
          d5: arm(e, f),
          head: HD,
        };
      }
      function drawFig(p) {
        const F = figure(p);
        ["d1", "d2", "d3", "d4", "d5"].forEach((id) =>
          $(id).setAttribute(
            "points",
            F[id].map((q) => q[0].toFixed(1) + "," + q[1].toFixed(1)).join(" "),
          ),
        );
        $("d6").setAttribute("cx", F.head[0].toFixed(1));
        $("d6").setAttribute("cy", F.head[1].toFixed(1));
      }
      let DEMO = 0;
      function playMotion(key) {
        const ps = (M[key] || M.stand).map(full),
          n = ps.length,
          seg = n === 2 ? 1200 : 700;
        if (matchMedia("(prefers-reduced-motion:reduce)").matches) {
          drawFig(ps[n - 1]);
          return;
        }
        const t0 = performance.now();
        drawFig(ps[0]);
        const fr = (t) => {
          const s = (Math.max(0, t - t0) / seg) % n,
            i = Math.floor(s),
            u = s - i,
            k = u * u * (3 - 2 * u),
            A = ps[i],
            B = ps[(i + 1) % n];
          drawFig(A.map((v, j) => v + (B[j] - v) * k));
          DEMO = requestAnimationFrame(fr);
        };
        DEMO = requestAnimationFrame(fr);
      }
      const ytUrl = (e) =>
        "https://www.youtube.com/results?search_query=" +
        encodeURIComponent("how to do " + e.n + " exercise proper form");
      const YT =
        '<svg viewBox="0 0 24 24" width="22" height="16" aria-hidden="true"><rect x="1" y="4" width="22" height="16" rx="5" fill="#e52d27"/><path d="M10 8.5v7l6-3.5z" fill="#fff"/></svg>';
      function iconBar(e) {
        const b = el("span", "ibar"),
          d = el("button", "ibtn", "🎬");
        d.setAttribute("aria-label", "Show how to do " + e.n);
        d.title = "How to do it";
        d.onclick = () => showDemo(e);
        const y = el("a", "ibtn", YT);
        y.href = ytUrl(e);
        y.target = "_blank";
        y.rel = "noopener noreferrer";
        y.setAttribute("aria-label", "Watch " + e.n + " videos on YouTube");
        y.title = "Watch on YouTube";
        b.append(d, y);
        return b;
      }
      function titleRow(e) {
        const r = el("div", "row");
        r.style.cssText = "gap:8px;flex-wrap:nowrap";
        r.append(el("h2", "t", e.i + " " + e.n), iconBar(e));
        return r;
      }
      function closeDemo() {
        cancelAnimationFrame(DEMO);
        const o = $("demo");
        if (o) o.remove();
      }
      function showDemo(e) {
        closeDemo();
        const o = el("div", "demo");
        o.id = "demo";
        o.onclick = (ev) => {
          if (ev.target === o) closeDemo();
        };
        const c = el("div", "dcard");
        c.setAttribute("role", "dialog");
        c.setAttribute("aria-label", e.n + " demo");
        c.appendChild(el("h2", "t", e.i + " " + e.n));
        const sc = el(
          "div",
          "dscreen",
          '<svg viewBox="0 -14 100 94" aria-hidden="true"><line x1="3" y1="74.5" x2="97" y2="74.5" stroke="#4d7a25" stroke-width=".8"/><polyline id="d1"/><polyline id="d2"/><polyline id="d3"/><polyline id="d4"/><polyline id="d5"/><circle id="d6" r="5"/></svg>',
        );
        c.append(sc, el("p", "dtip", TIPS[e.id] || ""));
        const r = el("div", "row"),
          cl = el("button", "btn", "Got it");
        cl.onclick = closeDemo;
        const y = el("a", "btn dk sm", YT + " Watch on YouTube");
        y.href = ytUrl(e);
        y.target = "_blank";
        y.rel = "noopener noreferrer";
        y.style.cssText =
          "display:inline-flex;gap:6px;align-items:center;text-decoration:none";
        r.append(cl, y);
        c.appendChild(r);
        o.appendChild(c);
        document.body.appendChild(o);
        playMotion(AL[e.id] || e.id);
        cl.focus();
      }
      addEventListener("keydown", (ev) => {
        if (ev.key === "Escape") closeDemo();
      });

      setVoice(VOICE, true);
      $("vsay").onclick = () => setVoice(!VOICE);
      $("vmic").onclick = mic;
      mergeLog();
      document.addEventListener("visibilitychange", () => {
        if (
          document.visibilityState === "visible" &&
          (autoT || tOn || P.ph === "work" || P.ph === "rest")
        )
          wake(true);
      });
      go("train");
    </script>
    <script>
      if ("serviceWorker" in navigator)
        addEventListener("load", () =>
          navigator.serviceWorker.register("sw.js").catch(() => {}),
        );
    </script>
  </body>
</html>
