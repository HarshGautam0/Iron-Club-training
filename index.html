<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--wood1:#4a2c17;--wood2:#35200f;--leather:#7a4526;--leather2:#5a3019;--brass:#d9a441;--brass2:#8d6420;--paper:#f1e6c8;--ink:#2d2013;--steel1:#e4e4e0;--steel2:#a9aaa6;--red:#b3261e;--lcd:#2a3a1c;--lcdtxt:#b9e36a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--wood1:#2b190c;--wood2:#1d1008;--paper:#e6d9b8}}
:root[data-theme="dark"]{--wood1:#2b190c;--wood2:#1d1008;--paper:#e6d9b8}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;height:100%;overflow:hidden;background:repeating-linear-gradient(92deg,var(--wood1) 0 7px,var(--wood2) 7px 9px,var(--wood1) 9px 22px,#3d2412 22px 23px);background-color:var(--wood1);font-family:'Special Elite','Courier New',monospace;color:var(--ink)}
.app{max-width:480px;margin:0 auto;height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;padding:10px 10px 8px}
.leather{background:radial-gradient(circle at 20% 15%,rgba(255,255,255,.12),transparent 40%),repeating-radial-gradient(circle at 30% 40%,rgba(0,0,0,.07) 0 1px,transparent 1px 3px),linear-gradient(160deg,var(--leather),var(--leather2));border-radius:16px;box-shadow:0 8px 18px rgba(0,0,0,.55),inset 0 2px 2px rgba(255,255,255,.2),inset 0 -3px 6px rgba(0,0,0,.4);position:relative}
.leather::after{content:"";position:absolute;inset:5px;border:2px dashed rgba(240,214,160,.6);border-radius:12px;pointer-events:none}
.top{display:flex;justify-content:space-between;align-items:center;padding:9px 16px;flex:none}
.plate{font-family:'Bevan',Georgia,serif;font-size:18px;color:#3a2606;padding:5px 14px;border-radius:6px;background:linear-gradient(180deg,#f3d58a,var(--brass) 45%,var(--brass2));box-shadow:0 2px 3px rgba(0,0,0,.6),inset 0 1px 1px #fff8;text-shadow:0 1px 0 #fff6}
#date{color:#f0d9aa;font-size:12px}
.vb{display:flex;gap:6px}
.vbtn{font:inherit;font-size:16px;width:34px;height:34px;border:0;border-radius:50%;cursor:pointer;background:linear-gradient(180deg,#f7f7f3,var(--steel1) 50%,var(--steel2));box-shadow:0 3px 0 #6c6d69,0 5px 6px rgba(0,0,0,.5),inset 0 1px 1px #fff}
.vbtn.on{background:linear-gradient(180deg,#e7c26f,var(--brass))}
.vbtn.live{background:radial-gradient(circle at 35% 25%,#ff8a7a,var(--red));animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(179,38,30,.35),0 3px 0 #6c6d69}}
main{flex:1;min-height:0;position:relative}
.heard{position:absolute;left:8px;right:8px;top:4px;z-index:6;pointer-events:none;text-align:center;padding:6px 10px;border-radius:8px;background:var(--lcd);color:var(--lcdtxt);box-shadow:inset 0 2px 6px #000,0 4px 10px rgba(0,0,0,.5);opacity:0;transform:translateY(-8px);transition:.2s;font-size:14px}
.heard.on{opacity:1;transform:none}
.page{position:absolute;inset:0;display:none;flex-direction:column;gap:10px;min-height:0}
.page.on{display:flex;animation:flip .25s ease-out}
@keyframes flip{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
.tabs{flex:none;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px 14px}
.tab{font:inherit;font-size:12px;border:0;cursor:pointer;color:#3b3b38;padding:7px 2px;border-radius:10px;background:linear-gradient(180deg,#f7f7f3,var(--steel1) 50%,var(--steel2));box-shadow:0 4px 0 #6c6d69,0 6px 8px rgba(0,0,0,.5),inset 0 1px 1px #fff;z-index:1;position:relative;transition:transform .08s,box-shadow .08s}
.tab i{display:block;font-style:normal;font-size:20px}
.tab.on{transform:translateY(3px);background:linear-gradient(180deg,#e7c26f,var(--brass));box-shadow:0 1px 0 #6c6d69,inset 0 3px 6px rgba(0,0,0,.35);color:#2e1d05}
.tab:focus-visible,.btn:focus-visible,.bigbtn:focus-visible,.tile:focus-visible,.x:focus-visible,.qx:focus-visible,.vbtn:focus-visible{outline:3px solid #7fd0ff;outline-offset:2px}
.dials{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:18px 16px 12px}
.dial{background:radial-gradient(circle at 35% 30%,#fff,var(--steel1) 60%,var(--steel2));border-radius:50%;padding:5px;box-shadow:0 4px 8px rgba(0,0,0,.6),inset 0 0 0 4px var(--brass),inset 0 0 0 6px var(--brass2)}
.dial svg{display:block;width:100%;height:auto;border-radius:50%}
.needle{transform-origin:50px 52px;transition:transform 1.2s cubic-bezier(.3,1.6,.5,1)}
.cap{font-size:12px;text-align:center;color:#f0d9aa;margin-top:6px;position:relative;z-index:1}
.summary{padding:18px 20px;color:#f6e7c1;font-size:15px;line-height:30px}
.summary .t2{font-family:'Bevan',Georgia,serif;font-size:17px;color:#f3d58a}
.bars{display:flex;gap:6px;height:96px;margin:8px 0 6px}
.bc{flex:1;height:100%;display:grid;grid-template-rows:1fr auto auto;justify-items:center;gap:2px;font-size:11px;line-height:1.2;color:#f0d9aa}
.bc b{font-weight:400;font-size:10px;opacity:.85;min-height:12px}
.bar{align-self:end;width:100%;border-radius:4px 4px 2px 2px;background:linear-gradient(180deg,#f3d58a,var(--brass2));box-shadow:inset 0 1px 1px #fff8,0 2px 3px rgba(0,0,0,.5);transition:height .6s cubic-bezier(.3,1.4,.5,1)}
.bar.now{background:linear-gradient(180deg,#ff8a7a,var(--red))}
.summary{padding:12px 20px;line-height:26px}
.bars{height:80px}
.inp{width:70px;font:inherit;font-size:15px;padding:2px 6px;border:0;border-radius:6px;color:var(--lcdtxt);background:var(--lcd);box-shadow:inset 0 2px 5px #000;text-align:center}
.inp:focus-visible{outline:3px solid #7fd0ff}
.sumline{display:flex;justify-content:space-between;border-bottom:1px dotted #f0d9aa77}
.ledger{flex:1;min-height:0;overflow-y:auto;background:repeating-linear-gradient(180deg,transparent 0 27px,#9bb5c9 27px 28px),linear-gradient(90deg,#d9c9a0,var(--paper) 8%,var(--paper));background-attachment:local;border-radius:6px 14px 14px 6px;padding:10px 12px 14px 44px;box-shadow:0 8px 18px rgba(0,0,0,.55),inset 6px 0 10px rgba(0,0,0,.25);line-height:28px;font-size:15px}
.ledger h2{font-family:'Bevan',Georgia,serif;font-weight:400;margin:0;font-size:18px;line-height:28px}
.ent{display:flex;justify-content:space-between;align-items:center}
.ent span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty,.lap{color:#7a6a4c}
.lap{font-size:12px;color:#4b4b47;line-height:1.4}
.stamp{display:inline-block;transform:rotate(-4deg);border:2px solid var(--red);color:var(--red);padding:0 8px;line-height:22px;font-size:13px;border-radius:4px}
.x{font:inherit;border:0;background:none;color:var(--red);cursor:pointer;font-size:18px;padding:0 6px}
.rack{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(2,1fr);grid-auto-rows:minmax(46px,1fr);gap:10px;padding:2px 2px 6px}
.tile{font:inherit;color:#3b3b38;text-align:left;border:0;cursor:pointer;padding:5px 10px;border-radius:10px;display:flex;gap:9px;align-items:center;font-size:14px;line-height:1.15;background:linear-gradient(180deg,#f7f7f3,var(--steel1) 50%,var(--steel2));box-shadow:0 5px 0 #6c6d69,0 8px 10px rgba(0,0,0,.5),inset 0 1px 1px #fff;transition:transform .08s,box-shadow .08s}
.tile i{font-style:normal;font-size:21px}
.tile:active,.tile.sel{transform:translateY(4px);box-shadow:0 1px 0 #6c6d69,inset 0 3px 6px rgba(0,0,0,.35)}
.tile.sel{background:linear-gradient(180deg,#e7c26f,var(--brass));color:#2e1d05}
.station{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-around;align-items:center;background:linear-gradient(180deg,rgba(255,255,255,.55),transparent 18%),repeating-linear-gradient(90deg,#c9cac6 0 1px,#dedfdb 1px 3px);border-radius:16px;padding:10px;box-shadow:0 8px 18px rgba(0,0,0,.55),inset 0 2px 2px #fff,inset 0 -3px 5px rgba(0,0,0,.3);text-align:center;position:relative}
.station::before,.station::after{content:"";position:absolute;top:7px;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#888);box-shadow:0 1px 2px #000a}
.station::before{left:8px}.station::after{right:8px}
.station.plan{justify-content:flex-start;gap:8px}
h2.t{font-family:'Bevan',Georgia,serif;font-weight:400;font-size:19px;margin:0;color:#4b4b47;text-shadow:0 1px 0 #fff}
.odo{display:inline-flex;gap:3px;padding:6px 9px;background:#17110b;border-radius:10px;box-shadow:inset 0 3px 8px #000,0 1px 0 #fff;font-size:44px;line-height:1.2em}
.odo.sm{font-size:26px;padding:4px 7px}
.w{width:.68em;height:1.2em;overflow:hidden;border-radius:4px;background:linear-gradient(180deg,#888,#f6f2e4 28%,#fff 50%,#f6f2e4 72%,#777);box-shadow:inset 0 0 6px #0008;font-family:'Bevan',Georgia,serif;color:#1c1c1c}
.w .s{transition:transform .45s cubic-bezier(.4,1.4,.5,1)}
.w .s b{display:block;height:1.2em;text-align:center;font-weight:400}
.row{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}
.btn{font:inherit;font-size:14px;padding:9px 14px;border:0;border-radius:9px;cursor:pointer;color:#3a2606;background:linear-gradient(180deg,#f3d58a,var(--brass) 50%,var(--brass2));box-shadow:0 4px 0 #5c4010,0 6px 8px rgba(0,0,0,.45),inset 0 1px 1px #fff9;transition:transform .08s,box-shadow .08s}
.btn:active,.btn.in{transform:translateY(3px);box-shadow:0 1px 0 #5c4010,inset 0 2px 5px rgba(0,0,0,.4)}
.btn.dk{color:#fff;background:linear-gradient(180deg,#5b5b57,#2e2e2b);box-shadow:0 4px 0 #111,0 6px 8px rgba(0,0,0,.45),inset 0 1px 1px #fff4}
.btn.rd{color:#fff;background:linear-gradient(180deg,#e3584c,var(--red) 55%,#7a150f);box-shadow:0 4px 0 #4d0d09,0 6px 8px rgba(0,0,0,.45),inset 0 1px 1px #fff6}
.btn.sm{padding:6px 10px;font-size:13px}
.back{align-self:flex-start;flex:none}
.bigwrap{width:116px;height:116px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#9a9a96);padding:8px;box-shadow:0 6px 12px rgba(0,0,0,.6),inset 0 0 3px #666}
.bigbtn{width:100%;height:100%;border-radius:50%;border:0;cursor:pointer;font:inherit;color:#fff;font-size:19px;text-shadow:0 -1px 0 #0007;background:radial-gradient(circle at 35% 25%,#ff8a7a,var(--red) 55%,#6a120c);box-shadow:0 7px 0 #5a0f0a,0 10px 12px rgba(0,0,0,.5),inset 0 2px 4px #fff7;transition:transform .07s,box-shadow .07s}
.bigbtn:active{transform:translateY(6px);box-shadow:0 1px 0 #5a0f0a,inset 0 4px 10px rgba(0,0,0,.45)}
.watch{border-radius:50%;padding:7px;background:conic-gradient(#fff,#999,#f3d58a,#8d6420,#fff,#999,#fff);box-shadow:0 8px 16px rgba(0,0,0,.6);flex:none}
.watch svg{display:block;width:100%;height:100%;border-radius:50%}
.hand{transform-origin:100px 100px}
.lcd{display:inline-block;padding:4px 14px;font-size:26px;letter-spacing:2px;color:var(--lcdtxt);background:var(--lcd);border-radius:6px;box-shadow:inset 0 2px 6px #000;text-shadow:0 0 6px #8fd03a}
.rail{position:relative;width:100%;height:16px;border-radius:8px;background:#17110b;box-shadow:inset 0 2px 5px #000,0 1px 0 #fff}
.fill{position:absolute;left:0;top:3px;bottom:3px;border-radius:6px;background:linear-gradient(180deg,#f3d58a,var(--brass2));transition:width .3s}
.queue{flex:1;min-height:0;width:100%;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:2px 2px 4px}
.qi{display:flex;align-items:center;gap:8px;background:var(--paper);color:var(--ink);border-radius:8px;padding:6px 8px;font-size:14px;box-shadow:inset 0 1px 3px rgba(0,0,0,.35),0 1px 0 #fff;text-align:left}
.qn{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-family:'Bevan',Georgia,serif;font-size:13px;color:#3a2606;background:linear-gradient(180deg,#f3d58a,var(--brass2));box-shadow:0 1px 2px rgba(0,0,0,.5)}
.qt{flex:1;min-width:0}
.qx{font:inherit;border:0;background:none;cursor:pointer;color:var(--ink);font-size:17px;padding:2px 6px;border-radius:5px}
.qx.d{color:var(--red)}
.cfg{flex:none;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center;background:linear-gradient(180deg,rgba(255,255,255,.55),transparent 18%),repeating-linear-gradient(90deg,#c9cac6 0 1px,#dedfdb 1px 3px);border-radius:14px;padding:10px;box-shadow:0 8px 18px rgba(0,0,0,.55),inset 0 2px 2px #fff}
@media (max-height:640px){.dial{padding:3px}.bigwrap{width:96px;height:96px}.odo{font-size:36px}}
@media (max-width:360px){#date{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head>
<body><div class="app">
<header class="leather top"><span class="plate">The Iron Club</span><span id="date"></span><span class="vb"><button class="vbtn" id="vsay" aria-label="Voice coaching on or off">🔊</button><button class="vbtn" id="vmic" aria-label="Hands-free voice commands">🎤</button></span></header>
<main><div id="heard" class="heard" role="status"></div>
  <section class="page" id="p-home"><div class="leather"><div class="dials" id="dials"></div></div><div class="leather summary" id="sum"></div></section>
  <section class="page" id="p-train"></section>
  <section class="page" id="p-plan"></section>
  <section class="page" id="p-log"><div class="ledger" id="ledger"></div></section>
</main>
<nav class="leather tabs" id="tabs"></nav>
</div>
<script>
/* ---------- data ---------- */
const EX=[];
const X=(g,k,l)=>l.forEach(([id,n,i])=>EX.push({id,n,i,k,g}));
X('s','rep',[['push','Push-ups','💪'],['squat','Squats','🏋️'],['lunge','Lunges','🚶'],['wlunge','Walking lunges','🐾'],['bridge','Glute bridges','🌉'],['calf','Calf raises','🦶'],['clam','Clamshells','🐚'],['side','Side leg raises','🦵'],['pike','Pike push-ups','🔺'],['dips','Tricep dips','🪑'],['kick','Donkey kicks','🍑']]);
X('s','time',[['wall','Wall sit','🧱']]);
X('c','rep',[['crunch','Crunches','🤸'],['bicycle','Bicycle crunches','🚲'],['twist','Russian twists','🌀'],['legr','Leg raises','🦿'],['super','Supermans','🦸'],['bird','Bird-dogs','🐕']]);
X('c','time',[['plank','Plank','📏'],['sidep','Side plank','📐'],['flutter','Flutter kicks','🦋'],['hollow','Hollow hold','🥣'],['mtn','Mountain climbers','⛰️']]);
X('r','rep',[['stride','Strides','⚡'],['bound','Bounding','🦘'],['burpee','Burpees','🔥'],['skater','Skater jumps','⛸️'],['jjack','Jumping jacks','⭐'],['jsquat','Jump squats','🚀']]);
X('r','time',[['hk','High knees','🐇'],['butt','Butt kicks','🥾'],['askip','A-skips','🤾'],['sprint','Sprint bursts','💨'],['rope','Jump rope','➰'],['shadow','Shadow boxing','🥊']]);
X('m','time',[['bal','Single-leg balance','🧘'],['hams','Hamstring stretch','🙆'],['quads','Quad stretch','🧎'],['hips','Hip flexor stretch','🏃'],['catcow','Cat-cow','🐈'],['child',"Child's pose",'🛌'],['calfs','Calf stretch','🧦'],['pigeon','Pigeon pose','🕊️'],['spine','Spinal twist','🌪️'],['arms','Arm circles','🔄']]);
const GN={s:'Strength',c:'Core',r:'Cardio',m:'Stretch'};
const PACES=[['Slow',3000],['Normal',2000],['Fast',1200]];
const GOAL={reps:150,mins:15,sets:10,kcal:150};
const PRE=[['🔥 Quick warm-up',[['hk',30],['butt',30],['askip',30],['arms',30],['jjack',20]]],
['🦵 Leg day',[['squat',20],['lunge',16],['bridge',20],['wall',40],['calf',25],['jsquat',12]]],
['💪 Upper body',[['push',15],['pike',10],['dips',12],['super',12],['plank',40]]],
['🎯 Core crusher',[['plank',40],['bicycle',30],['twist',30],['flutter',30],['legr',15],['hollow',20]]],
['⚡ Cardio blast',[['jjack',30],['burpee',10],['mtn',30],['skater',20],['sprint',20],['hk',30]]],
['🧘 Cool-down',[['hams',30],['quads',30],['hips',30],['child',30],['spine',30]]]];
const exOf=id=>EX.find(e=>e.id===id);
const $=id=>document.getElementById(id);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const two=n=>String(n).padStart(2,'0');
const fmt=ms=>{const s=Math.floor(ms/1000),h=Math.floor(s/3600);return (h?h+':':'')+two(Math.floor(s/60)%60)+':'+two(s%60)};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const desc=it=>{const x=exOf(it.ex);return x.i+' '+x.n+' · '+(x.k==='rep'?it.v+' reps, '+PACES[it.pi][0]:it.v+' s')};

/* ---------- state ---------- */
let log=[],tab='train',cur=null,count=0,target=20,tTarget=30,pi=1,autoT=null,tBase=0,tStart=0,tOn=false,tTimer=null,CAT='s';
const P={q:[],rest:10,idx:0,ph:'idle',paused:false,acc:0,cnt:0,tot:0,last:0,tm:null,label:''};
let S={ex:null,v:20,pi:1};
const dayKey=()=>new Date().toDateString();
try{const d=JSON.parse(localStorage.getItem('ironclub')||'null');if(d&&d.day===dayKey())log=d.log||[]}catch(e){}
try{const d=JSON.parse(localStorage.getItem('ironclub-plan')||'null');if(d){P.q=(d.q||[]).filter(it=>exOf(it.ex));P.rest=typeof d.rest==='number'?d.rest:10}}catch(e){}
const dk=()=>new Date().toLocaleDateString('en-CA');let HIST={};try{HIST=JSON.parse(localStorage.getItem('ironclub-hist')||'{}')}catch(e){}
function tot(){let reps=0,secs=0;log.forEach(e=>{if(e.u==='reps'){reps+=e.v;secs+=e.v*3}else if(e.u==='sec')secs+=e.v});return{reps,secs,sets:log.length,kcal:kcalTotal()}}
const save=()=>{HIST[dk()]=tot();try{localStorage.setItem('ironclub',JSON.stringify({day:dayKey(),log}));localStorage.setItem('ironclub-hist',JSON.stringify(HIST))}catch(e){}};
const savePlan=()=>{try{localStorage.setItem('ironclub-plan',JSON.stringify({q:P.q,rest:P.rest}))}catch(e){}};
const add=e=>{const o=log.find(z=>z.ex===e.ex&&z.u===e.u);if(o){o.v+=e.v;o.n=(o.n||1)+1;log=log.filter(z=>z!==o);log.push(o)}else{e.id=Date.now()+Math.random();e.n=1;log.push(e)}save()};
$('date').textContent=new Date().toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'});

/* ---------- voice ---------- */
let VOICE=true,want=false,rec=null,lastSpoke=0,WL=null,AC;
try{VOICE=localStorage.getItem('ic-voice')!=='0'}catch(e){}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function say(t,force){if(!VOICE&&!force)return;t=String(t).replace(/push-ups?/gi,m=>m.replace('-','')).replace(/-/g,' ');try{const u=new SpeechSynthesisUtterance(t);u.rate=1.05;u.onend=()=>lastSpoke=Date.now();speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function tick(f){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f||880;g.gain.value=.07;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+.07)}catch(e){}}
function setVoice(v,quiet){VOICE=v;try{localStorage.setItem('ic-voice',v?'1':'0')}catch(e){}$('vsay').textContent=v?'🔊':'🔇';$('vsay').classList.toggle('on',v);if(v&&!quiet)say('Voice coaching on',true)}
function heard(t){const h=$('heard');h.textContent=t;h.classList.add('on');clearTimeout(heard.t);heard.t=setTimeout(()=>h.classList.remove('on'),3500)}

function cmd(t){
  let m;const act=P.ph==='work'||P.ph==='rest';
  if(m=t.match(/(?:go to|open|show|take me to) +(?:the +)?([a-z]+)/)){const pg={dials:'home',dial:'home',home:'home',today:'home',train:'train',training:'train',exercises:'train',routine:'plan',plan:'plan',presets:'plan',log:'log',ledger:'log',history:'log'}[m[1]];if(pg){go(pg);say('Opening '+m[1]);return}}
  if(/\bstart\b.*\b(routine|workout)\b/.test(t)){go('plan');if(P.ph==='idle')startPlan();return}
  if(/\b(pause|hold)\b/.test(t)){if(act&&!P.paused)togglePP();else if(autoT)stopAuto();else if(tOn)stopT();return}
  if(/\b(resume|continue|carry on)\b/.test(t)){if(act&&P.paused)togglePP();else if(cur&&cur.k==='rep'&&!autoT)startAuto();else if(cur&&cur.k==='time'&&!tOn)startT();return}
  if(/\bstop\b|\bfinish\b|\bend\b/.test(t)){if(act)stopPlan();else if(autoT)stopAuto();else if(tOn)stopT();return}
  if(/\b(skip|next)\b/.test(t)){if(act)P.ph==='rest'?beginWork():closeItem(false);return}
  if(/\b(log|save)\b/.test(t)){if(cur)commit();return}
  if(/\bunmute\b|\btalk to me\b/.test(t)){setVoice(true);return}
  if(/\b(mute|quiet|silence)\b/.test(t)){say('Muted');setVoice(false,true);return}
  const e=findEx(t);
  if(e&&/\b(start|do|begin)\b/.test(t)){const n=(t.match(/[0-9]+/)||[])[0];go('train');work(e);if(e.k==='rep'){if(n)target=clamp(+n,1,999);upd();startAuto()}else{if(n)tTarget=clamp(+n,5,3600);upd();startT()}return}
  heard('Try: start 20 push-ups, start routine, go to log');
}

/* calories: MET x body weight x time (rough estimate) */
const MET_G={s:4.5,c:3.8,r:7.5,m:2.3},MET_X={rope:11,sprint:10,burpee:8,hk:8,butt:8,mtn:8,jjack:7,jsquat:8,shadow:6,wall:3.5,bal:2.5};
let WT=70;try{WT=+localStorage.getItem('ic-wt')||70}catch(e){}
function kcal(e){const x=EX.find(z=>z.n===e.ex);if(!x)return 0;const met=MET_X[x.id]||MET_G[x.g]||4;const secs=e.u==='sec'?e.v:e.u==='reps'?e.v*3:0;return met*WT*secs/3600}
const kcalTotal=()=>Math.round(log.reduce((a,e)=>a+kcal(e),0));
function mergeLog(){const m=[];log.forEach(e=>{const o=m.find(z=>z.ex===e.ex&&z.u===e.u);if(o){o.v+=e.v;o.n=(o.n||1)+(e.n||1)}else m.push({...e,n:e.n||1})});if(m.length!==log.length){log=m;save()}}
function extra(){$('sum').insertAdjacentHTML('beforeend','<div class="sumline"><span>⚡ Burned today (≈)</span><span>'+kcalTotal()+' kcal</span></div><div class="sumline"><span>Body weight</span><span><input id="wt" class="inp" type="number" inputmode="decimal" min="30" max="250" value="'+WT+'" aria-label="Body weight in kilograms"> kg</span></div>');
  $('wt').onchange=()=>{const v=parseFloat($('wt').value);if(v>=30&&v<=250){WT=v;try{localStorage.setItem('ic-wt',v)}catch(e){}render()}}}
/* goals adapt automatically: ~15% above your recent daily average, and level up when you beat them */
const TIERUP={};
function goal(metric,val){
  const def={reps:250,mins:20,kcal:200}[metric],step=metric==='mins'?5:10,nm={reps:'Reps',mins:'Active',kcal:'Burn'}[metric];
  const vals=Object.keys(HIST).filter(k=>k!==dk()).sort().slice(-14).map(k=>HIST[k]).filter(h=>h&&h.sets>0).map(h=>metric==='reps'?h.reps:metric==='mins'?h.secs/60:(h.kcal||0)).filter(v=>v>0);
  let g=vals.length?Math.max(def*.6,vals.reduce((a,b)=>a+b,0)/vals.length*1.15):def;g=Math.ceil(g/step)*step;
  let up=false;while(val>=g){g=Math.ceil(g*1.4/step)*step;up=true}
  TIERUP[nm]=up;return g}
function weekChart(){
  HIST[dk()]=tot();const days=[],now=new Date();
  for(let i=6;i>=0;i--){const d=new Date(now);d.setDate(now.getDate()-i);const k=d.toLocaleDateString('en-CA'),h=HIST[k]||{};days.push({l:d.toLocaleDateString(undefined,{weekday:'narrow'}),v:h.reps||0,s:h.secs||0,n:h.sets||0})}
  const max=Math.max(goal('reps',0),...days.map(d=>d.v));let streak=0;
  for(let i=6;i>=0;i--){if(days[i].n>0)streak++;else if(i===6)continue;else break}
  $('sum').innerHTML='<div class="t2">This week · reps per day</div><div class="bars">'+days.map((d,i)=>'<div class="bc"><div class="bar'+(i===6?' now':'')+'" style="height:'+(d.v?Math.max(6,d.v/max*100):2)+'%"></div><span>'+d.l+'</span><b>'+(d.v||'')+'</b></div>').join('')+'</div><div class="sumline"><span>🔥 Streak</span><span>'+streak+' day'+(streak==1?'':'s')+'</span></div><div class="sumline"><span>Active time this week</span><span>'+Math.floor(days.reduce((a,d)=>a+d.s,0)/60)+' min</span></div>'}
function dial(label,val,goal,unit,anim){
  const p=Math.min(1,val/goal),ang=-90+p*180;
  return `<div><div class="dial"><svg viewBox="0 0 100 80"><defs><radialGradient id="d${label}" cx=".4" cy=".3"><stop offset="0" stop-color="#fffdf2"/><stop offset="1" stop-color="#e3d6ad"/></radialGradient></defs><rect width="100" height="80" fill="url(#d${label})"/>
  ${[...Array(11)].map((_,i)=>{const a=(-90+i*18)*Math.PI/180;return `<line x1="${50+Math.sin(a)*38}" y1="${52-Math.cos(a)*38}" x2="${50+Math.sin(a)*(i%5?33:30)}" y2="${52-Math.cos(a)*(i%5?33:30)}" stroke="${i>8?'#b3261e':'#2d2013'}" stroke-width="${i%5?1:1.8}"/>`}).join('')}
  <text x="50" y="68" text-anchor="middle" font-size="9" font-family="Bevan,serif" fill="#2d2013">${unit}</text>
  <g class="needle" data-a="${ang}" style="transform:rotate(${anim?-90:ang}deg)"><line x1="50" y1="52" x2="50" y2="20" stroke="#b3261e" stroke-width="2" stroke-linecap="round"/></g><circle cx="50" cy="52" r="4" fill="#8d6420"/></svg></div>
  <div class="cap">${label}<br>${val} / ${goal}${TIERUP[label]?' ▲':''}</div></div>`}
function render(anim){
  let reps=0,secs=0;const names=new Set();log.forEach(e=>{names.add(e.ex);if(e.u==='reps'){reps+=e.v;secs+=e.v*3}else if(e.u==='sec')secs+=e.v});
  const m=Math.floor(secs/60),sets=log.length;
  $('dials').innerHTML=dial('Reps',reps,goal('reps',reps),'reps',anim)+dial('Active',m,goal('mins',m),'min',anim)+dial('Burn',kcalTotal(),goal('kcal',kcalTotal()),'kcal',anim);
  if(anim)requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll('.needle').forEach(n=>n.style.transform='rotate('+n.dataset.a+'deg)')));
  $('sum').innerHTML='<div class="t2">Today\'s totals</div><div class="sumline"><span>Reps</span><span>'+reps+'</span></div><div class="sumline"><span>Hold &amp; timed work</span><span>'+m+' min '+two(secs%60)+' s</span></div><div class="sumline"><span>Sets done</span><span>'+sets+'</span></div><div class="sumline"><span>Different exercises</span><span>'+names.size+'</span></div>';
  weekChart();extra();const L=$('ledger');L.innerHTML='<h2>Today\'s entries</h2>';
  if(!log.length)L.appendChild(el('div','empty','Nothing written yet. Pick an exercise or load a preset.'));
  [...log].reverse().forEach(e=>{
    const t=e.u==='sec'?fmt(e.v*1000):e.u==='km'?e.v+' km':e.v+' reps';
    const r=el('div','ent','<span>'+e.i+' '+e.ex+' — '+t+(e.n>1?' ('+e.n+'×)':'')+' · ≈'+Math.round(kcal(e))+' kcal</span>');
    const x=el('button','x','×');x.setAttribute('aria-label','Delete entry');x.onclick=()=>{log=log.filter(z=>z.id!==e.id);save();render()};r.appendChild(x);L.appendChild(r)});
  if(reps>=goal('reps',0)||m>=goal('mins',0)||kcalTotal()>=goal('kcal',0)){const s=el('div','');s.innerHTML='<span class="stamp">Goal reached</span>';L.appendChild(s)}}
setVoice(VOICE,true);$('vsay').onclick=()=>setVoice(!VOICE);$('vmic').onclick=mic;
mergeLog();document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&(autoT||tOn||P.ph==='work'||P.ph==='rest'))wake(true)});
go('train');
</script><script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script></body></html>
